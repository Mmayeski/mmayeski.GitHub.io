<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Ingest Articles</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #e0e0e0;
    }

    p {
      font-size: 13px;
      color: #888;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.4);
      color: #e0e0e0;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input:focus {
      outline: none;
      border-color: rgba(100, 100, 220, 0.5);
    }

    button {
      width: 100%;
      padding: 14px 24px;
      border-radius: 8px;
      border: 1px solid rgba(100, 100, 220, 0.4);
      background: rgba(80, 80, 180, 0.5);
      color: #e0e0e0;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: rgba(80, 80, 180, 0.7);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    #status.success {
      display: block;
      background: rgba(100, 200, 100, 0.15);
      border: 1px solid rgba(100, 200, 100, 0.3);
      color: #a0e0a0;
    }

    #status.error {
      display: block;
      background: rgba(200, 100, 100, 0.15);
      border: 1px solid rgba(200, 100, 100, 0.3);
      color: #e0a0a0;
    }

    #status.loading {
      display: block;
      background: rgba(100, 100, 200, 0.15);
      border: 1px solid rgba(100, 100, 200, 0.3);
      color: #a0a0e0;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 13px;
      text-decoration: none;
    }

    .back-link:hover {
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ingest Articles</h1>
    <p>Fetch articles from RSS feeds and store them in the database with category-based positioning.</p>

    <label for="secret">Ingest Secret Key</label>
    <input type="password" id="secret" placeholder="Enter your INGEST_SECRET_KEY" />

    <button id="ingest-btn">Ingest Articles</button>

    <div id="status"></div>

    <a href="/" class="back-link">Back to News Grid</a>
  </div>

  <script>
    const secretInput = document.getElementById('secret');
    const ingestBtn = document.getElementById('ingest-btn');
    const status = document.getElementById('status');

    ingestBtn.addEventListener('click', async () => {
      const secret = secretInput.value.trim();
      if (!secret) {
        status.className = 'error';
        status.textContent = 'Please enter your ingest secret key.';
        return;
      }

      ingestBtn.disabled = true;
      status.className = 'loading';
      status.textContent = 'Fetching and processing RSS feeds...';

      try {
        const res = await fetch('/api/ingest', {
          method: 'POST',
          headers: { 'x-ingest-key': secret }
        });

        const data = await res.json();

        if (res.ok && data.inserted !== undefined) {
          status.className = 'success';
          status.innerHTML = `
            <strong>Success!</strong><br>
            Articles processed: ${data.inserted}<br>
            Feeds processed: ${data.feeds_processed || 'N/A'}<br>
            ${data.errors > 0 ? `Errors: ${data.errors}` : 'No errors'}
          `;
        } else {
          status.className = 'error';
          status.textContent = data.error || 'Ingestion failed. Check your secret key.';
        }
      } catch (err) {
        status.className = 'error';
        status.textContent = 'Network error: ' + err.message;
      }

      ingestBtn.disabled = false;
    });

    // Allow Enter key to trigger ingestion
    secretInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') ingestBtn.click();
    });
  </script>
</body>
</html>
